<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>COMMUNITY 360 - Inicio de Sesión de Administradores</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="brand-badge">
          <i class="bi bi-shield-lock-fill"></i> Módulo de Seguridad
        </div>
        <h2 class="fw-bold tracking-tight text-white mb-1">COMMUNITY 360</h2>
        <p class="text-secondary small">Panel de Administración de la Comunidad Virtual</p>
      </div>

      <!-- Contenedor de Alertas de Error / Éxito -->
      <div id="alertContainer" class="alert alert-danger alert-custom" role="alert">
        <div class="d-flex align-items-center gap-2">
          <i id="alertIcon" class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
          <span id="alertMessage">Mensaje de error</span>
        </div>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form id="loginForm" novalidate>
        <!-- Campo Correo Electrónico -->
        <div class="mb-3">
          <label for="correoInput" class="form-label">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent text-secondary border-end-0" style="border-radius: 0.75rem 0 0 0.75rem;">
              <i class="bi bi-envelope"></i>
            </span>
            <input 
              type="email" 
              class="form-control border-start-0" 
              id="correoInput" 
              name="correo"
              placeholder="admin@community360.com" 
              autocomplete="email"
              required
            >
          </div>
        </div>

        <!-- Campo Contraseña con botón Mostrar/Ocultar -->
        <div class="mb-4">
          <label for="passwordInput" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent text-secondary border-end-0" style="border-radius: 0.75rem 0 0 0.75rem;">
              <i class="bi bi-key"></i>
            </span>
            <input 
              type="password" 
              class="form-control border-start-0 border-end-0" 
              id="passwordInput" 
              name="password"
              placeholder="••••••••••••" 
              autocomplete="current-password"
              required
            >
            <button 
              type="button" 
              class="input-group-text" 
              id="togglePasswordBtn" 
              title="Mostrar u ocultar contraseña"
              aria-label="Mostrar u ocultar contraseña"
            >
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <!-- Botón de Envío con Indicador de Carga -->
        <button type="submit" class="btn-primary-custom" id="submitBtn">
          <span class="spinner-border spinner-border-sm d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
          <span id="btnText">Iniciar Sesión</span>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center">
        <p class="text-secondary small mb-0">
          <i class="bi bi-database-check text-success"></i> Autenticación contra TiDB Cloud (SQL)
        </p>
      </div>
    </div>
  </main>

  <!-- Script Cliente de Autenticación -->
  <script src="/js/login.js"></script>
</body>
</html>
